# Builds the site and publishes it to GitHub Pages on every push to main.
# Repository → Settings → Pages → Source must be set to "GitHub Actions".
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deployment finish; queue at most one more behind it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Read the Pages address
        id: pages
        uses: actions/configure-pages@v6

      - name: Install dependencies
        run: npm ci

      # Optimised images are slow to produce and rarely change — keep them between runs.
      # (Restored after the install, because `npm ci` starts from an empty node_modules.)
      - name: Restore the image cache
        uses: actions/cache@v6
        with:
          path: node_modules/.astro
          key: astro-images-${{ hashFiles('src/assets/**') }}
          restore-keys: astro-images-

      - name: Build
        run: npm run build
        env:
          # The *.github.io address until a custom domain is set in Settings → Pages,
          # the custom domain afterwards. Nothing to change here when the domain moves.
          SITE_URL: ${{ steps.pages.outputs.origin }}
          BASE_PATH: ${{ steps.pages.outputs.base_path }}

      - name: Upload the site
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v5
